name: Build iPhone IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown structure and editor geometry
        run: |
          mkdir -p checks
          swiftc Suixing/ContentCore.swift Validation/CoreChecks.swift -o checks/content-core
          checks/content-core
          swiftc -parse-as-library -O Validation/FileReferenceChecks.swift -o checks/file-references
          checks/file-references | tee checks/file-reference-performance.json
      - name: Build native iPhone app without signing
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project Suixing.xcodeproj -scheme Suixing \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Suixing.app package/Payload/
          test -f package/Payload/Suixing.app/Suixing
          file package/Payload/Suixing.app/Suixing
          cd package
          zip -qr Suixing-unsigned.ipa Payload
          shasum -a 256 Suixing-unsigned.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Suixing-iPhone-unsigned
          path: |
            package/Suixing-unsigned.ipa
            package/SHA256.txt
          if-no-files-found: error
          retention-days: 7
      - name: Build iPhone 13 Pro simulator
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x["identifier"] for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and "iOS" in x["identifier"]]; print(r[-1])')
          DEVICE=$(xcrun simctl create Suixing-UI-Review com.apple.CoreSimulator.SimDeviceType.iPhone-13-Pro "$RUNTIME")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project Suixing.xcodeproj -scheme Suixing \
            -configuration Debug -sdk iphonesimulator -destination "id=$DEVICE" \
            -derivedDataPath simulator-build CODE_SIGNING_ALLOWED=NO build
          echo "$DEVICE" > .simulator-id
      - name: Render native iPhone 13 Pro screens
        run: |
          set -euo pipefail
          DEVICE=$(cat .simulator-id)
          xcrun simctl install "$DEVICE" simulator-build/Build/Products/Debug-iphonesimulator/Suixing.app
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl ui "$DEVICE" appearance light
          mkdir -p screenshots
          xcrun simctl launch "$DEVICE" local.suixing.pocket.zhang --design-preview --run-checks
          sleep 2
          DATA=$(xcrun simctl get_app_container "$DEVICE" local.suixing.pocket.zhang data)
          cat "$DATA/Documents/photo-checks.json"
          cp "$DATA/Documents/photo-checks.json" screenshots/photo-checks.json
          xcrun simctl terminate "$DEVICE" local.suixing.pocket.zhang
          for ENGINE in codex dsh workbuddy; do
            xcrun simctl launch "$DEVICE" local.suixing.pocket.zhang --design-preview --engine "$ENGINE"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "screenshots/$ENGINE-iPhone13Pro-preview.png"
            xcrun simctl terminate "$DEVICE" local.suixing.pocket.zhang
          done
          for PANEL in token-expanded show-market show-formatting show-editor show-notifications show-questions show-sidebar show-updates show-recording; do
            xcrun simctl launch "$DEVICE" local.suixing.pocket.zhang --design-preview --engine codex "--$PANEL"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "screenshots/codex-$PANEL-iPhone13Pro-preview.png"
            xcrun simctl terminate "$DEVICE" local.suixing.pocket.zhang
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Suixing-native-UI-review
          path: screenshots/*
          if-no-files-found: error
          retention-days: 7
      - name: Check native gestures, streaming and repeated session switches
        run: |
          set -euo pipefail
          DEVICE=$(cat .simulator-id)
          xcodebuild -project Suixing.xcodeproj -scheme Suixing \
            -configuration Debug -sdk iphonesimulator -destination "id=$DEVICE" \
            -derivedDataPath simulator-build -resultBundlePath UI-Checks.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
          xcrun simctl shutdown "$DEVICE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Suixing-UI-test-results
          path: UI-Checks.xcresult
          if-no-files-found: ignore
          retention-days: 7
